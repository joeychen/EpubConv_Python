[project]
name = "epubconv-python"
version = "3.0.0"
description = "Convert EPUB files between Simplified and Traditional Chinese writing systems"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
authors = [
    { name = "ThanatosDi", email = "yykkold55tw@gmail.com" },
]
dependencies = [
    "aiohttp>=3.14.3,<4",
    "beautifulsoup4>=4.15.0,<5",
    "chardet>=7.6.0,<8",
    "cssutils>=2.15.0,<3",
    "loguru>=0.7.3,<0.8",
    "lxml>=6.1.1,<7",
    "opencc>=1.4.1,<2",
    "requests>=2.34.2,<3",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pyinstaller = ">=6.22.1,<7"
pytest = ">=9.1.1,<10"
pytest-asyncio = ">=1.4.0,<2"
ruff = ">=0.16.3,<0.17"

[build-system]
requires = ["poetry-core==2.4.1"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".codegraph", ".serena"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"*.spec" = ["F821"]
